{% load custom_filters %}
{% with is_done=user|onboarding_page_seen:page_key %}
<a href="{% url url %}" class="flex items-center gap-3 px-3 py-2 rounded-lg {% if is_done %}bg-green-50 dark:bg-green-900/20{% else %}bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700{% endif %} transition group">
    <div class="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center {% if is_done %}bg-green-500{% else %}border-2 border-gray-300 dark:border-gray-500 group-hover:border-primary-400{% endif %} transition">
        {% if is_done %}
        <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        {% endif %}
    </div>
    <span class="text-sm {% if is_done %}text-green-700 dark:text-green-400 line-through opacity-70{% else %}text-gray-700 dark:text-gray-300{% endif %}">{{ label }}</span>
</a>
{% endwith %}
