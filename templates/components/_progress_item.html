{% if done %}
<div id="progress-item-{{ item_key }}" class="progress-item flex items-center gap-2 py-1" data-done="true">
    <div class="item-dot flex-shrink-0 w-4 h-4 rounded-full flex items-center justify-center bg-green-500">
        <svg class="w-2.5 h-2.5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
    </div>
    <span class="item-label text-xs text-gray-400 dark:text-gray-500 line-through">{{ label }}</span>
</div>
{% elif item_key in skipped %}
<div id="progress-item-{{ item_key }}" class="progress-item flex items-center gap-2 py-1" data-done="true">
    <div class="item-dot flex-shrink-0 w-4 h-4 rounded-full flex items-center justify-center bg-gray-300 dark:bg-gray-500">
        <svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg>
    </div>
    <span class="item-label text-xs text-gray-400 dark:text-gray-500 line-through opacity-60">{{ label }} <span class="not-italic text-gray-400">(skipped)</span></span>
</div>
{% else %}
<div id="progress-item-{{ item_key }}" class="progress-item flex items-center gap-2 py-1" data-done="false">
    <div class="item-dot flex-shrink-0 w-4 h-4 rounded-full bg-gray-200 dark:bg-gray-600"></div>
    <span class="item-label text-xs text-gray-600 dark:text-gray-300">{{ label }}</span>
    <span class="text-xs text-gray-400 dark:text-gray-500 ml-1 hidden sm:inline">{{ hint }}</span>
    {% if skippable %}
    <button id="skip-btn-{{ item_key }}" onclick="skipProfileItem('{{ item_key }}')" class="ml-auto text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition underline flex-shrink-0">skip</button>
    {% endif %}
</div>
{% endif %}
