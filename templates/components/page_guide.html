{% load custom_filters %}
{% if user.is_authenticated %}
{% if not user|onboarding_page_seen:page_key %}
<div id="page-guide-modal-{{ page_key }}"
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 sm:p-6 bg-black/50"
     role="dialog" aria-modal="true" aria-labelledby="guide-title-{{ page_key }}">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
        <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-5 py-4">
            <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center flex-shrink-0">
                        {{ guide_icon }}
                    </div>
                    <div>
                        <p class="text-xs font-medium text-white/70 uppercase tracking-wide">Page Guide</p>
                        <h2 id="guide-title-{{ page_key }}" class="text-base font-bold text-white leading-tight">{{ guide_title }}</h2>
                    </div>
                </div>
                <button onclick="closePageGuide('{{ page_key }}')" class="text-white/60 hover:text-white transition flex-shrink-0 mt-0.5" aria-label="Close guide">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
        <div class="px-5 py-4 space-y-3">
            {{ guide_body }}
        </div>
        <div class="px-5 pb-4">
            <button onclick="closePageGuide('{{ page_key }}')" class="w-full bg-primary-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-primary-700 active:scale-95 transition">
                Got it
            </button>
        </div>
    </div>
</div>

<script nonce="{{ request.csp_nonce }}">
function closePageGuide(pageKey) {
    var modal = document.getElementById('page-guide-modal-' + pageKey);
    if (modal) modal.remove();
    fetch('{% url "onboarding_mark_page_visited" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: pageKey }),
    });
}
</script>
{% endif %}
{% endif %}
