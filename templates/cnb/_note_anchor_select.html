{% comment %}Pin selector for a resolution note. Expects: select_id, selected ('' = not pinned), note_anchor_choices.{% endcomment %}
<label for="{{ select_id }}" class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Pin next to <span class="text-gray-400">(tablet &amp; desktop)</span></label>
<select id="{{ select_id }}" name="anchor"
        class="w-full text-xs px-2 py-1.5 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded-lg focus:ring-2 focus:ring-primary-500">
    <option value="" {% if not selected %}selected{% endif %}>Not pinned</option>
    {% for value, label in note_anchor_choices %}
    <option value="{{ value }}" {% if value == selected %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
</select>
