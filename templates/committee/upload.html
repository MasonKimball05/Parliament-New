{% extends "base.html" %}

{% block title %}Upload Document - {{ committee.name }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="{% url 'committee_documents' committee.code %}" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">← Back to Documents</a>
    </div>

    <h2 class="text-3xl font-bold mb-6 text-gray-900 dark:text-gray-100">Upload Document</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-6">Committee: {{ committee.name }}</p>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 transition-colors duration-200">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Select File
                </label>
                <input type="file" name="file" required
                       class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded px-3 py-2">
            </div>
            <div class="flex gap-3">
                <button type="submit" class="bg-blue-500 dark:bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-600 dark:hover:bg-blue-700 transition-colors">
                    Upload
                </button>
                <a href="{% url 'committee_documents' committee.code %}"
                   class="bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-6 py-2 rounded hover:bg-gray-400 dark:hover:bg-gray-600 inline-block transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
