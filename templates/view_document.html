{% extends 'base.html' %}
{% load static %}

{% block title %}{{ document_title }}{% endblock %}

{% block content %}
<div class="flex flex-col h-[calc(100vh-64px)]">
    <!-- Minimal Header Bar -->
    <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-2 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center space-x-3">
            <a href="{{ back_url|default:'javascript:history.back()' }}" class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Go back">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-base font-medium text-gray-900 dark:text-white truncate max-w-xs sm:max-w-md md:max-w-lg">{{ document_title }}</h1>
        </div>
        <div class="flex items-center space-x-2">
            <a href="{{ document_url }}" target="_blank" class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Open in new tab">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
            <a href="{{ document_url }}" download class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Download">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Document Viewer - Full Height -->
    <div class="flex-1 bg-gray-200 dark:bg-gray-900">
        {% if is_pdf %}
        <embed
            src="{{ document_url }}"
            type="application/pdf"
            class="w-full h-full"
            title="{{ document_title }}">
        </embed>
        {% elif is_image %}
        <div class="w-full h-full flex items-center justify-center p-4 bg-gray-100 dark:bg-gray-800">
            <img src="{{ document_url }}" alt="{{ document_title }}" class="max-w-full max-h-full object-contain">
        </div>
        {% else %}
        <div class="w-full h-full flex flex-col items-center justify-center p-8 text-center">
            <svg class="w-16 h-16 text-gray-400 dark:text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <p class="text-gray-600 dark:text-gray-400 mb-4">This file type cannot be previewed.</p>
            <a href="{{ document_url }}" download class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                Download File
            </a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
