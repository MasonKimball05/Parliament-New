version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Don't auto-update Django major versions — those need manual review
      - dependency-name: django
        update-types: ["version-update:semver-major"]
