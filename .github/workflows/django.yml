name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: parliament_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: parliament_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U parliament_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: Parliament.settings_postgres
          DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: parliament_test_db
          DB_USER: parliament_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_SSLMODE: disable
          LOG_DIR: /tmp
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: Parliament.settings_postgres
          DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: parliament_test_db
          DB_USER: parliament_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_SSLMODE: disable
          LOG_DIR: /tmp
        run: python manage.py test --verbosity=2

      - name: Lint with flake8 (syntax errors only)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,staticfiles,migrations

      - name: Check formatting with black
        continue-on-error: true
        run: |
          pip install black
          black --check . --exclude '(.venv|staticfiles|migrations)'
