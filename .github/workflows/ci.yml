name: Django CI/CD

# Consolidated workflow (07-05-26): django.yml was a subset of this file and was
# removed. Tests run against the real Parliament.settings (ci_settings.py deleted
# after the settings unification) with env-driven config below.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: parliament_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: parliament_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: Parliament.settings
      DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
      # Valid Fernet key for EncryptedCharField/EncryptedEmailField in tests.
      # CI-only — NOT a production secret.
      ENCRYPTION_KEY: 'HjGdIfMrGRWLLYtZQPm6NyLyyYl9_Cpco4telPFcAh8='
      DJANGO_DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: parliament_test_db
      DB_USER: parliament_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_SSLMODE: disable
      LOG_DIR: /tmp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Migrations are tracked in git as of 07-05-26. CI must never generate
    # them — instead, fail if a model change is missing its migration.
    - name: Check for missing migrations
      run: python manage.py makemigrations --check --dry-run

    - name: Run migrations
      run: python manage.py migrate --noinput

    - name: Run tests
      run: python manage.py test --verbosity=2

    - name: Check code formatting (optional)
      continue-on-error: true
      run: |
        pip install black
        black --check . --exclude '(.venv|staticfiles|migrations)'

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8 (syntax errors only)
      run: |
        # Fail only on actual syntax errors and undefined names — not style
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=.venv,staticfiles,migrations
        # Style warnings as informational only
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=.venv,staticfiles,migrations

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
        pip install -r requirements.txt

    - name: Dependency vulnerability scan (pip-audit)
      run: |
        pip-audit --ignore-vuln PYSEC-2025-49

    # -lll = fail only on HIGH severity. (The old '-ll' failed on MEDIUM+,
    # contradicting the step name — fixed 07-05-26.)
    - name: Static security scan (bandit) — fail on HIGH
      run: |
        bandit -r src/ -lll --exclude src/migrations

    - name: Static security scan (bandit) — warn on MEDIUM
      continue-on-error: true
      run: |
        bandit -r src/ -ll --exclude src/migrations
