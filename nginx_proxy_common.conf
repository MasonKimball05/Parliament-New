# Shared proxy_pass settings for every location that forwards to Django.
#
# Split out of nginx.conf (v3.27.0) so the auth-path location (login,
# password reset — see nginx.conf) doesn't have to hand-copy these headers.
# A copy that drifts from the original is exactly the failure mode this
# project's CLAUDE.md keeps finding elsewhere in the codebase (two things that
# must stay in sync, one file to edit instead of two) — no reason to
# introduce a fresh instance of it in nginx.conf.
proxy_pass http://parliament_app;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# v4.4.15 (11-19-26 pentest): overwrite CF-Connecting-IP with the address nginx
# has already verified. The realip block in nginx.conf only trusts the header
# from a Cloudflare edge, so $remote_addr here is the real visitor when the
# request came through Cloudflare and the real socket peer when it didn't.
# Django reads CF-Connecting-IP (src/utils/security_utils.get_client_ip), and
# nginx used to pass a client-sent one straight through, so a request that
# reached the origin directly could pick its own IP for the login rate limits,
# the blocklist, honeypot bans and audit rows. Now it can't, whichever way it
# arrives, and CLOUDFLARE_VERIFY_ORIGIN can stay off behind this nginx. (Turning
# it on here would flag every visitor as forged: nginx hands Django the
# visitor's address, not Cloudflare's.)
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;
proxy_redirect off;
proxy_buffering off;
