# Shared proxy_pass settings for every location that forwards to Django.
#
# Split out of nginx.conf (v3.27.0) so the auth-path location (login,
# password reset — see nginx.conf) doesn't have to hand-copy these headers.
# A copy that drifts from the original is exactly the failure mode this
# project's CLAUDE.md keeps finding elsewhere in the codebase (two things that
# must stay in sync, one file to edit instead of two) — no reason to
# introduce a fresh instance of it in nginx.conf.
proxy_pass http://parliament_app;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;
proxy_redirect off;
proxy_buffering off;
