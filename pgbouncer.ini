# pgbouncer.ini — reference config for Parliament's connection pooler.
#
# Added 09-16-26 after a live incident: a burst of concurrent pledge-onboarding
# logins drove Postgres past max_connections ("remaining connection slots are
# reserved for roles with the SUPERUSER attribute"), 500-ing nearly every page.
# Root cause: Parliament/settings.py sets DB_CONN_MAX_AGE=300, so every Django
# worker holds its Postgres connection open for 5 minutes after the request
# that opened it finishes — a burst leaves a large idle backlog behind it
# instead of releasing connections as it settles. Bumping max_connections
# (100 -> 250, done live that night) buys headroom but doesn't fix the
# underlying shape: it just moves the wall further away.
#
# pgbouncer fixes the shape itself: Django (web, Celery worker, Celery beat,
# and manage.py commands — they all read the same DB_HOST/DB_PORT from .env)
# connects to pgbouncer instead of Postgres directly. pgbouncer holds a small,
# FIXED pool of real Postgres backend connections and multiplexes many more
# client-side connections onto it. When demand spikes past the pool, new
# clients wait briefly for a free backend connection instead of Postgres
# refusing them outright — the difference between a short queue and a 500.
#
# This file is a REFERENCE COPY, same convention as nginx.conf at the repo
# root — the live file lives at /etc/pgbouncer/pgbouncer.ini on the server and
# is not auto-deployed; copy this over by hand per docs/PGBOUNCER_SETUP.md.
# DB_NAME/DB_USER below are placeholders — fill in the real values from the
# server's .env (do not commit the real values here; this file is checked
# into a public GitHub repo, same as nginx.conf — see CLAUDE.md's
# "exportable_media is public by design" note for why that matters here too).

[databases]
; Replace PARLIAMENT_DB_NAME with the value of DB_NAME in the server's .env.
; host/port here point at the REAL Postgres instance — pgbouncer sits in
; front of it, so this is the only place in the whole stack still naming
; Postgres's real port (5432) directly.
PARLIAMENT_DB_NAME = host=127.0.0.1 port=5432 dbname=PARLIAMENT_DB_NAME

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

; Only the app box itself ever needs to reach this — nothing external, no
; nginx exposure. Matches the "localhost-only" posture DB_HOST=localhost
; already assumes today.

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; SESSION pooling, not transaction — deliberately the more conservative mode
; for this rollout. Session mode gives each Django connection its own
; backend connection for the connection's lifetime, so it behaves exactly
; like talking to Postgres directly (advisory locks, multi-statement
; transactions, the `-c statement_timeout=30000` startup option Django
; already sets in settings.py's OPTIONS all keep working unmodified).
; Transaction pooling packs more headroom out of the same pool_size but can
; break session-scoped behavior Django or a management command might rely on
; — not worth the risk on the first rollout of a tool this codebase has never
; run before. Revisit only if pool_size genuinely becomes the bottleneck.
pool_mode = session

; Real Postgres backend connections handed out per (user, database) pair.
; 20 is comfortably under max_connections=250 with room left for direct
; psql/admin sessions and Postgres's own reserved superuser slots — the
; exact two things that were NOT the bottleneck the night of the incident
; (it was ordinary app connections crowding everything else out).
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

; How many CLIENT-side connections (i.e. Django/Celery connections into
; pgbouncer) it will accept before it starts refusing. Set far above
; anything this app will ever open — the whole point is that pgbouncer, not
; Postgres, is the thing absorbing a burst.
max_client_conn = 500

; A backend connection sitting idle (not `min_pool_size` of them) gets
; closed after 60s. This is the actual fix for the incident's shape: instead
; of DB_CONN_MAX_AGE=300 holding a real Postgres connection open for 5
; minutes after use, only pgbouncer's lightweight client-side slot persists
; that long — the expensive real connection underneath it is released back
; to the pool within a minute of going idle.
server_idle_timeout = 60

; Recommended pairing with modern psycopg2/libpq clients — avoids a
; known pgbouncer/libpq parameter-negotiation quirk on startup.
ignore_startup_parameters = extra_float_digits

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

admin_users = postgres
