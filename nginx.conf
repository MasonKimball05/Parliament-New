events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    upstream parliament_app {
        server web:8000;
    }

    # Rate limiting (v3.27.0) — application-level lockouts (LoginRateLimitMiddleware,
    # LoginLockout) already exist and are the real defense; these zones exist to
    # blunt a flood BEFORE it wakes Daphne up at all, per the roadmap's own framing
    # ("application-level lockouts exist and are good, but they run after Django has
    # been woken up"). Keyed on $binary_remote_addr, which is only the real visitor
    # address because of the realip block below — without it, every visitor behind
    # Cloudflare would share Cloudflare's own edge IPs and this would throttle
    # everyone together instead of one abusive client.
    #   general_zone: every request. 10r/s + burst 20 is generous — this is a floor
    #     against a flood, not a per-user cap; the app-level limiters are stricter
    #     and know about usernames/accounts, which nginx does not.
    #   auth_zone: login + password-reset only (see the location block below).
    #     1r/s + burst 5 is deliberately tighter — these are the anonymous,
    #     credential-guessing-shaped endpoints, and a real user submitting a login
    #     form once every few seconds never notices this ceiling.
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        # Recover the real visitor IP from Cloudflare's CF-Connecting-IP header —
        # but ONLY when the immediate TCP peer is itself a published Cloudflare
        # edge. nginx's realip module already does this safely: if the peer is not
        # one of the ranges below, $remote_addr is left as the raw socket peer, so
        # a request that reaches this server any other way (bypassing Cloudflare)
        # cannot pick its own address by sending the header — the same guarantee
        # `CLOUDFLARE_VERIFY_ORIGIN` (Parliament/settings.py) provides at the
        # application layer, enforced one layer earlier and for every consumer of
        # $remote_addr, including the rate-limit zones above.
        #
        # Generated from src/utils/cloudflare_ranges.py — regenerate with
        # `manage.py render_nginx_cloudflare_block` if that file's ranges change;
        # do not hand-edit only one of the two.
        # BEGIN cloudflare-ranges (generated 2026-08-07 from src/utils/cloudflare_ranges.py — DO NOT hand-edit; run `manage.py render_nginx_cloudflare_block`)
        real_ip_header CF-Connecting-IP;
        real_ip_recursive on;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        # Loopback, so a health check or debug curl run on the host itself still
        # resolves to something real rather than being silently ignored.
        set_real_ip_from 127.0.0.1;
        # END cloudflare-ranges

        # OPTIONAL, NOT ENABLED — closes the "origin reachable directly, bypassing
        # Cloudflare's proxy/WAF entirely" gap one step further than real_ip does:
        # refuses any connection whose peer isn't a Cloudflare edge at all, rather
        # than just declining to trust its header. This is an availability call
        # (breaks anything that legitimately hits the origin outside Cloudflare —
        # a health monitor, a webhook, a debug curl from the box itself) that
        # wasn't safe to flip on without live-traffic visibility this session.
        # See nginx_cloudflare_only.conf for the reasoning and how to test it
        # before enabling.
        # include nginx_cloudflare_only.conf;

        # A flood of new connections from one IP (not just requests) exhausts
        # worker connections before it ever produces enough requests for
        # limit_req to notice. 20 concurrent is comfortably above any real
        # browser (a handful of keepalive connections) and well below what a
        # flood needs to matter.
        limit_conn conn_zone 20;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files — blocked from direct access.
        # All downloads go through Django views which enforce @login_required and
        # object-level permission checks. Direct /media/ URLs return 403.
        location /media/ {
            return 403;
        }

        # Git-tracked exportable media (chapter documents, images)
        # v3.17.6: URL renamed to hyphens (50ac888). The on-disk directory is
        # still exportable_media, so only the location changes.
        location /exportable-media/ {
            alias /app/exportable_media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Login + password-reset — the anonymous, credential-guessing-shaped
        # endpoints. A tighter nginx-level ceiling than the rest of the site,
        # ahead of (not instead of) LoginRateLimitMiddleware's own per-IP/
        # per-username lockouts. Matches src/urls.py's actual path names —
        # update this regex if those routes are ever renamed.
        location ~ ^/(login|password-reset|password-reset-confirm)/? {
            limit_req zone=auth_zone burst=5 nodelay;
            include nginx_proxy_common.conf;
        }

        # Proxy to Django
        location / {
            limit_req zone=general_zone burst=20 nodelay;
            include nginx_proxy_common.conf;
        }

        # Health check endpoint
        location /health/ {
            access_log off;
            proxy_pass http://parliament_app;
            proxy_set_header Host $host;
        }
    }
}
