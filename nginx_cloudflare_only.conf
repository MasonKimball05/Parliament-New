# NOT included by default. See nginx.conf's `server {}` block for the
# commented-out `include nginx_cloudflare_only.conf;` line.
#
# This is an AVAILABILITY decision, not a drop-in security fix, which is why
# it isn't wired up automatically:
#
#   - It refuses any connection whose immediate TCP peer isn't a published
#     Cloudflare edge IP — i.e. it closes the "someone connects to the origin
#     IP directly, bypassing Cloudflare entirely" gap that
#     `CLOUDFLARE_VERIFY_ORIGIN` (Parliament/settings.py) only backstops at
#     the application layer. This is the actual fix; the app-level setting
#     is what catches a forged header if this line is ever removed or
#     misconfigured.
#   - But it means ANYTHING that hits the server on :80 without going through
#     Cloudflare stops working the moment this is enabled — a health monitor
#     hitting the public IP directly, a webhook receiver, `curl <server-ip>`
#     for debugging, or DNS not yet fully cut over to the proxied (orange
#     cloud) record. None of those are known to be in use today, but this
#     wasn't testable against live traffic from this session, so it's your
#     call rather than something to flip silently.
#
# To enable: uncomment the `include` line in nginx.conf's server block, then
# `nginx -t` before reloading, and test from an actual browser (through
# Cloudflare) AND from `curl http://<server-ip>/` (which should now get
# refused) before trusting it.
#
# Regenerate with `manage.py render_nginx_cloudflare_block --deny-block` —
# do not hand-edit; see src/utils/cloudflare_ranges.py for why.

# BEGIN cloudflare-only (generated 2026-08-07 from src/utils/cloudflare_ranges.py)
